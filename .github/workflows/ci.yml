name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional tap test files to run instead of the full suite'
        required: false
        default: ''

jobs:
  build:
    timeout-minutes: 40
    strategy:
      matrix:
        node-version: [16.x, 18.x]
        platform:
        - os: ubuntu-latest
          shell: bash
        - os: macos-latest
          shell: bash
        - os: windows-latest
          shell: bash
        - os: windows-latest
          shell: powershell
      fail-fast: false

    runs-on: ${{ matrix.platform.os }}
    defaults:
      run:
        shell: ${{ matrix.platform.shell }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v1.1.0

      - name: Use Nodejs ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm test -- -c -t0 --output-file=tap-output.tap ${{ inputs.test-filter }}

      - name: List skipped tests
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "Assertions skipped on win32 by the upstream tests' own skip: process.platform === 'win32' guards"
          echo "(patterns containing a literal backslash, which is the path separator on Windows):"
          grep -n "# SKIP" tap-output.tap

      - name: Pack
        if: matrix.platform.os == 'ubuntu-latest' && matrix.node-version == '18.x'
        run: npm pack

      - name: Upload package
        if: matrix.platform.os == 'ubuntu-latest' && matrix.node-version == '18.x'
        uses: actions/upload-artifact@v4
        with:
          name: minimatch-tgz
          path: minimatch-9.0.5.tgz
          if-no-files-found: error
